groups:
  - name: lork
    rules:
      - alert: LorkDown
        expr: probe_success{job="lork_health"} == 0
        for: 2m
        annotations:
          summary: Lork health check failing for 2 minutes

      - alert: LorkNoActiveProxies
        expr: lork_proxies_active == 0
        for: 5m
        annotations:
          summary: Lork has no usable proxies (all rate limited or dead)

      - alert: LorkProxyFailing
        expr: |
          sum by (host, port) (increase(lork_proxy_failures[30m]))
            / clamp_min(sum by (host, port) (increase(lork_proxy_successes[30m]) + increase(lork_proxy_failures[30m])), 1)
            > 0.5
          and sum by (host, port) (increase(lork_proxy_failures[30m])) >= 5
        for: 10m
        annotations:
          summary: 'Proxy {{ $labels.host }}:{{ $labels.port }} failing over half its auths'

      # Needs mtail (see mtail/lork.mtail). Without it these two never fire.
      - alert: LorkAuthSuccessRateLow
        expr: |
          sum(increase(lork_auth_results_total{status="SUCCESS"}[30m]))
            / clamp_min(sum(increase(lork_auth_results_total[30m])), 1)
            < 0.5
          and sum(increase(lork_auth_results_total{status!="SUCCESS"}[30m])) >= 10
        for: 10m
        annotations:
          summary: Fewer than half of all auth requests returned 200 over the last 30 minutes

      - alert: LorkAuthsBanned
        expr: sum(increase(lork_auth_results_total{status="BANNED"}[15m])) >= 5
        for: 5m
        annotations:
          summary: Lork returned 418 BANNED for 5 or more auths in 15 minutes

      # Needs mtail. The same failures lork-watchdog.sh restarts Lork for; fires whether
      # or not the watchdog is running.
      - alert: LorkBrowserStuck
        expr: |
          sum(increase(lork_devtools_connect_failed_total[5m])) >= 3
          or sum(increase(lork_page_load_timeouts_total[10m])) >= 5
        annotations:
          summary: Lork is logging dead DevTools connections or login page timeouts

      - alert: LorkMemoryHigh
        expr: container_memory_working_set_bytes{name=~".*lork.*"} > 3.5e9
        for: 10m
        annotations:
          summary: Lork container above 3.5 GB (compose limit is 4 GB)
